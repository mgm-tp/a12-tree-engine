      .card  { fill:#f8fafc; stroke:#cbd5e1; stroke-width:1 }
      .block { fill:#ffffff; stroke:#cbd5e1; stroke-width:1 }
      .lib   { fill:#eef4ff; stroke:#93b4e8; stroke-width:1 }
      .tp    { fill:#f1f2f4; stroke:#a9b1bd; stroke-width:1 }
      .own   { fill:#fffdf5; stroke:#d6b877; stroke-width:1; stroke-dasharray:5 3 }
      .name  { font-size:14px; fill:#0f172a }
      .libnm { font-size:14px; fill:#1e3a8a }
      .tpnm  { font-size:14px; fill:#334155 }
      .lead  { font-size:15px; font-weight:600; fill:#0f172a }
      .sub   { font-size:12px; fill:#64748b }
      .cap   { font-size:11px; fill:#64748b; font-style:italic }
      .libcp { font-size:11px; fill:#3b6bb5; font-style:italic }
      .band  { font-size:11px; font-weight:600; letter-spacing:.06em; fill:#94a3b8 }
      .edge  { stroke:#64748b; stroke-width:1.4; fill:none; marker-end:url(#arw) }
    </style>
  </defs>

