<!--
  Tree Engine — introduction overview diagram (container level, hand-authored SVG).
  Location in this bundle: documentation/src/assets/images/tree-engine-overview.svg
  Embedded from the introduction as image::assets/images/tree-engine-overview.svg[…]

  The bundle has no architecture chapter; this diagram answers where the engine sits, what runs
  alongside it in the browser, what it interprets, and where its nodes come from.
  Everything the engine needs runs in the one browser process; nothing here is a service —
  only Data Services runs elsewhere.
  Composition and context only — no internal call flow, no consumers.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" width="1180" height="620" role="img" aria-labelledby="t d" font-family="'Segoe UI', Inter, system-ui, sans-serif">
  <title id="t">Tree Engine overview</title>
  <desc id="d">The Tree Engine is a library inside an A12 client application — one browser process built by the project, into which the engine registers itself as a view. Its own parts are the view, a React component tree built on the Widgets tree table; the store, which holds the loaded nodes together with the expansion, selection, paging, clipboard, and dialog state; the sagas, which carry out expansion, loading, node creation, deletion, moving, copying, and drag and drop; the server connector, which turns the engine's queries and mutations into A12 Data Services requests; and the model conversion and localization, which turn the Tree Model into the runtime model and resolve the rendered texts. In the same process run the A12 libraries the engine builds on — Client for the application frame, the view registration, and the activity handling, Kernel for Document Model access and document services, Data Services Access for building the queries and mutations, Relationship Engine for coordinating the linking of created documents, and Widgets for the tree table and the form controls — and third-party libraries, among them React, Redux, react-dnd, and styled-components, which the application provides as peer dependencies — the Artifacts section lists the full set. The project's own code — custom components, a custom data loader, custom sagas, and configuration — runs there too. The engine works on one model and one kind of data: a Tree Model, which defines the node types, columns, buttons, node actions, context menu, and row activation, authored with the SME; and documents connected by links, which are the nodes of the tree. The documents and links live in Data Services, which runs outside the browser process and answers the engine's queries and mutations over JSON-RPC.</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#64748b"/>
    </marker>
    <style>
