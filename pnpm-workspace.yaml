lockfileIncludeTarballUrl: false

loglevel: info

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - "@com.mgmtp.a12.*/*"

strictPeerDependencies: true

peerDependencyRules:
  allowedVersions:
    # react-shallow-renderer is pulled in by the Enzyme React 18 adapter and caps its react peer at
    # 18. The tests only use mount(), never shallow(), so running it against React 19 is fine.
    "react-shallow-renderer>react": "19"

allowBuilds:
  core-js: true
  esbuild: true
  typemoq: true
