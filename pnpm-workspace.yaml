packages:
  - ./*

overrides:
  # The Enzyme React 18 adapter ships with react-is@18, whose isElement() does not recognise the
  # react.transitional.element symbol React 19 uses, so every mount() is rejected as an invalid
  # element. Scoped to the adapter so other react-is consumers keep their own versions.
  "@cfaester/enzyme-adapter-react-18>react-is": "^19.1.1"

patchedDependencies:
  # The published entry point assigns its exports onto the CommonJS `this`, which the ESM interop of
  # the browser test runner leaves undefined. typemoq loads it, so every browser suite would break.
  circular-json@0.3.3: patches/circular-json@0.3.3.patch
  react-dnd@16.0.1: patches/react-dnd@16.0.1.patch

