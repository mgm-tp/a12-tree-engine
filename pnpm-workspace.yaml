lockfileIncludeTarballUrl: false

loglevel: info

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - "@com.mgmtp.a12.*/*"

strictPeerDependencies: true

peerDependencyRules:
  allowedVersions:
    # eslint-config@4 plugins declare eslint peer <=9 but work with eslint 10; allow it so strict install passes
    "eslint-plugin-import>eslint": "10"
    "eslint-plugin-react>eslint": "10"
    "eslint-plugin-unused-imports>eslint": "10"

allowBuilds:
  core-js: true
  esbuild: true
  typemoq: true
